<!DOCTYPE html>
<html lang="ug" dir="rtl">
<head>
  <!--
    `--base-href` ile değiştirilir (GitHub Pages için: /quran_app/).
    Bu değer "/" ile başlamalı ve bitmelidir.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="قۇرئان كەرىم - Kur'an-ı Kerim mushaf okuyucu">
  <meta name="theme-color" content="#00897B">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="قۇرئان كەرىم">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>قۇرئان كەرىم</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #FFF8E1; }
    #app-loader {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 24px;
      font-family: system-ui, sans-serif; color: #00695C;
      transition: opacity .3s ease;
    }
    #app-loader .spinner {
      width: 40px; height: 40px; border-radius: 50%;
      border: 3px solid rgba(0, 137, 123, .15); border-top-color: #00897B;
      animation: spin 1s linear infinite;
    }
    #app-loader .title { font-size: 28px; font-weight: bold; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app-loader" aria-live="polite">
    <div class="title">قۇرئان كەرىم</div>
    <div class="spinner" role="progressbar" aria-label="يۈكلىنىۋاتىدۇ"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('app-loader');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
