<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Rahle üzerinde açık Kur'an. Arka plan tam kare (maskable için);
       köşe yuvarlama render sırasında uygulanır. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#14A394"/>
      <stop offset="0.6" stop-color="#00796B"/>
      <stop offset="1" stop-color="#004D40"/>
    </radialGradient>
    <linearGradient id="woodA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C98B4E"/>
      <stop offset="1" stop-color="#8A4F22"/>
    </linearGradient>
    <linearGradient id="woodB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A9672F"/>
      <stop offset="1" stop-color="#6B3A17"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF3D1"/>
      <stop offset="1" stop-color="#F1DDA8"/>
    </linearGradient>
    <linearGradient id="pageR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#FFF3D1"/>
      <stop offset="1" stop-color="#F1DDA8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE082"/>
      <stop offset="1" stop-color="#E0A526"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Arka plandaki silik sekiz köşeli yıldız (rub el hizb) -->
  <g transform="translate(256 236)" fill="none" stroke="#FFE082" stroke-opacity="0.16" stroke-width="6">
    <rect x="-150" y="-150" width="300" height="300"/>
    <rect x="-150" y="-150" width="300" height="300" transform="rotate(45)"/>
    <circle r="62"/>
  </g>

  <!-- Üstte küçük altın yıldız -->
  <g transform="translate(256 112)" fill="url(#gold)">
    <rect x="-20" y="-20" width="40" height="40"/>
    <rect x="-20" y="-20" width="40" height="40" transform="rotate(45)"/>
  </g>
  <circle cx="256" cy="112" r="9" fill="#00796B"/>

  <!-- Rahle: çapraz iki tahta -->
  <g stroke-linecap="round">
    <line x1="372" y1="262" x2="160" y2="440" stroke="url(#woodB)" stroke-width="38"/>
    <line x1="140" y1="262" x2="352" y2="440" stroke="url(#woodA)" stroke-width="38"/>
    <!-- oyma detayı -->
    <line x1="160" y1="276" x2="330" y2="419" stroke="#5A2F12" stroke-opacity="0.35" stroke-width="4"/>
  </g>
  <circle cx="256" cy="359" r="13" fill="url(#gold)" stroke="#7A4A12" stroke-width="3"/>

  <!-- Kitap kapağı (sayfaların altında görünen kenar) -->
  <path d="M256 318 L100 248 L100 226 L256 292 L412 226 L412 248 Z" fill="#00695C"/>
  <path d="M256 318 L100 248 L100 238 L256 306 L412 238 L412 248 Z" fill="#004D40"/>

  <!-- Açık sayfalar -->
  <path d="M256 300 C214 270 160 250 108 236 L108 168 C162 178 216 196 256 226 Z" fill="url(#pageL)"/>
  <path d="M256 300 C298 270 352 250 404 236 L404 168 C350 178 296 196 256 226 Z" fill="url(#pageR)"/>
  <!-- cilt (orta çizgi) -->
  <path d="M256 226 L256 300" stroke="#C9A55A" stroke-width="3"/>

  <!-- Satırlar -->
  <g fill="none" stroke="#00796B" stroke-width="5" stroke-linecap="round" stroke-opacity="0.75">
    <path d="M126 192 C166 200 206 214 238 234"/>
    <path d="M126 210 C166 218 206 232 238 252"/>
    <path d="M126 228 C166 236 206 250 238 270"/>
    <path d="M386 192 C346 200 306 214 274 234"/>
    <path d="M386 210 C346 218 306 232 274 252"/>
    <path d="M386 228 C346 236 306 250 274 270"/>
  </g>
  <!-- sayfa kenarlarında altın çerçeve -->
  <path d="M256 300 C214 270 160 250 108 236 L108 168 C162 178 216 196 256 226" fill="none" stroke="url(#gold)" stroke-width="5"/>
  <path d="M256 300 C298 270 352 250 404 236 L404 168 C350 178 296 196 256 226" fill="none" stroke="url(#gold)" stroke-width="5"/>
</svg>
