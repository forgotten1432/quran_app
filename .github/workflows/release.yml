name: Build Release (macOS & Android)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:  # Manuel tetikleme

jobs:
  # ═══════════════════════════════════════════
  # macOS Release Build
  # ═══════════════════════════════════════════
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true  # Git LFS dosyalarını çek (quran.pdf)

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Create DMG
        run: |
          APP_PATH="build/macos/Build/Products/Release/quran_app.app"
          DMG_NAME="QuranApp-macOS.dmg"
          
          # DMG oluştur
          hdiutil create -volname "Quran App" \
            -srcfolder "$APP_PATH" \
            -ov -format UDZO \
            "$DMG_NAME"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: QuranApp-macOS
          path: QuranApp-macOS.dmg
          retention-days: 30

      - name: Upload macOS App (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: QuranApp-macOS-app
          path: build/macos/Build/Products/Release/quran_app.app
          retention-days: 30

  # ═══════════════════════════════════════════
  # Android Release Build
  # ═══════════════════════════════════════════
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuranApp-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ═══════════════════════════════════════════
  # GitHub Release (sadece tag push'larında)
  # ═══════════════════════════════════════════
  create-release:
    needs: [build-macos, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            QuranApp-macOS/QuranApp-macOS.dmg
            QuranApp-Android/app-release.apk
          generate_release_notes: true
